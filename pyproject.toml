[project]
name = "legal-doc-qa"
version = "0.1.0"
description = "Cross-Lingual Contract Analyzer - upload a contract PDF and get key findings plus a multilingual Q&A chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "chromadb>=0.5.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_doc_qa"]
